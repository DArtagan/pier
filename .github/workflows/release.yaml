name: Release

on:
  push:
    branches:
      - main

jobs:
  # Tags and a GitHub release only: pier publishes no artifact, because
  # dotfiles packages it with Nix.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
