name: Release

on:
  push:
    branches:
      - main

# One run at a time, never cancelled: two release-please runs at once race on the
# release pull request and its tags. A run waiting behind another gives way to a
# newer one, which is fine, since every run reads all of main since the last release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Tags and a GitHub release only: pier publishes no artifact, because
  # dotfiles packages it with Nix.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5

  # A check on the open release pull request, failing when release-please
  # couldn't parse a commit, which it otherwise reports only in its log. A
  # job of its own because a step can't see an earlier step's output.
  commits-parsed:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/commits-parsed.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
